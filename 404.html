<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAJI — 404</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030508;color:#eef5ff;font-family:Inter,system-ui,sans-serif}
body{display:grid;place-items:center;overflow:hidden}
body:before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 50% 45%,rgba(130,190,255,.10),transparent 30%),radial-gradient(circle at 20% 20%,rgba(255,255,255,.035),transparent 22%);filter:blur(55px)}
.card{position:relative;width:min(520px,88vw);padding:38px;border-radius:28px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.055);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 30px 100px rgba(0,0,0,.35);text-align:center}
.crystal{width:110px;height:110px;margin:0 auto 24px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.2),rgba(255,255,255,.04) 45%,transparent 70%);box-shadow:inset 0 1px 1px rgba(255,255,255,.18),0 0 80px rgba(130,190,255,.1)}
.code{font-size:12px;letter-spacing:.3em;color:#8994a5;text-transform:uppercase}.num{font-size:64px;font-weight:600;letter-spacing:-.05em;margin:4px 0}.msg{color:#8994a5;font-size:13px;margin-bottom:25px}
a{display:inline-block;padding:11px 16px;border:1px solid rgba(255,255,255,.14);border-radius:13px;color:#eef5ff;text-decoration:none;background:rgba(255,255,255,.07)}
</style></head>
<body><main class="card"><div class="crystal"></div><div class="code">NAJI / signal lost</div><div class="num">404</div><div class="msg">This space does not exist.</div><a href="/">Return to NAJI</a></main></body>
</html>
