name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NAJI Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "No APK was produced." >&2
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAJI-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        run: |
          {
            echo "## NAJI Android Build"
            echo ""
            echo "- **Status:** APK build completed"
            echo "- **Branch:** `${{ github.ref_name }}`"
            echo "- **Commit:** `${{ github.sha }}`"
            echo "- **Artifact:** `NAJI-debug-apk`"
          } >> "$GITHUB_STEP_SUMMARY"
