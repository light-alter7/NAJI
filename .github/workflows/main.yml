name: Extract NAJI ZIP into Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          ZIP="naji-android-ready-updated.zip"
          TEMP="__naji_extract"

          echo "Checking ZIP..."
          test -f "$ZIP"

          rm -rf "$TEMP"
          mkdir "$TEMP"

          echo "Unzipping..."
          unzip -q "$ZIP" -d "$TEMP"

          echo "ZIP contents:"
          find "$TEMP" -maxdepth 3 -print

          # Find package.json anywhere inside the extracted archive
          PACKAGE_JSON=$(find "$TEMP" -type f -name "package.json" | head -n 1)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json was not found."
            exit 1
          fi

          APP_DIR=$(dirname "$PACKAGE_JSON")

          echo "App directory:"
          echo "$APP_DIR"

          # Copy everything, including hidden files
          cp -a "$APP_DIR"/. .

          # Remove temporary extraction directory
          rm -rf "$TEMP"

          # Remove ZIP from repository
          rm -f "$ZIP"

          echo "Final repository files:"
          find . -maxdepth 2 -not -path './.git/*' -print

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Extract NAJI app into repository"
          git push
